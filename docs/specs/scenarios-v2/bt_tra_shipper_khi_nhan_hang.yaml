id: bt_tra_shipper_khi_nhan_hang
ten: Trả tiền hàng, phí ship cho shipper khi đã nhận hàng
nhom: binh_thuong
doi_chieu_voi: gia_shipper
nguon:
  - {noi: "Tự viết", url: "", do_tin_cay: tu_viet}
mo_ta: >
  Người dùng có đơn hàng đang giao, xem được trên app mua hàng. Shipper mang hàng đến tận nơi; người dùng đã cầm
  và kiểm hàng rồi chuyển khoản tiền thu hộ hoặc phí ship cho shipper thay vì trả tiền mặt. Shipper không đòi gì thêm.
cac_buoc:
  - Shipper gọi báo giao hàng và mang hàng đến
  - Người dùng nhận hàng, đối chiếu mã đơn và số tiền trên app
  - Chuyển khoản đúng số tiền thu hộ theo số tài khoản hoặc mã QR shipper đưa
truong:
  nguoi_lien_lac: {nguoi_la: 0.9}
  kenh: {truc_tiep: 0.75, cuoc_goi: 0.2}
  tu_xung: {shipper: 0.98}
  ai_bat_dau: {ho_truoc: 0.9}
  ap_luc: {khong_co: 0.85, hoi_thuc: 0.12}
  yeu_cau: {chuyen_tien: 0.98}
  ly_do_tien: {tra_hang: 0.85, phi: 0.12}
  loai_tai_khoan: {ca_nhan: 0.9, to_chuc: 0.1}
  ten_khop_tu_xung: {co: 0.6, khong: 0.4}
  da_gap_truc_tiep: {co: 0.97}
  duoc_dan_cach_tra_loi: {khong: 0.99}
  mau_thuan_loi_ke_va_anh: {khong: 0.97}
  da_chuyen_truoc_do: {khong: 0.95}
dau_hieu:
  - Đã cầm hàng trên tay, đơn hàng có trên app mua hàng
  - Số tiền đúng bằng số tiền thu hộ của đơn
  - Shipper không đòi chuyển thêm, không gửi link hay số tổng đài
viec_can_kiem_tra:
  - Đối chiếu mã đơn và số tiền trên app trước khi chuyển
  - Chỉ chuyển khi đã cầm hàng
cau_noi_mau:
  - "Chị ơi đơn Shopee 245k, chị chuyển khoản hay tiền mặt ạ? Em gửi mã QR nhé."
