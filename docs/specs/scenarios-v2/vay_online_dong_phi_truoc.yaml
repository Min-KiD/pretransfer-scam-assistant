id: vay_online_dong_phi_truoc
ten: Mời vay tiền online lãi thấp, đòi nộp phí trước thì mới giải ngân
nhom: lua_dao
nguon:
  - {noi: "Bộ Công an, 31/10/2026 (Công an xã Lạc Sơn, Phú Thọ)", url: "https://www.bocongan.gov.vn/bai-viet/phu-tho-cong-an-xa-lac-son-kip-thoi-ngan-chan-vu-lua-dao-gia-danh-nhan-vien-ngan-hang-1793435269", do_tin_cay: da_doc}
  - {noi: "CafeF, 14/07/2026: Công an cảnh báo tuyệt đối không chuyển tiền trước để làm thủ tục vay", url: "https://cafef.vn/cong-an-canh-bao-tuyet-doi-khong-chuyen-tien-truoc-de-lam-thu-tuc-vay-188260714090725473.chn", do_tin_cay: tim_kiem}
mo_ta: >
  Một người tự xưng nhân viên ngân hàng, công ty tài chính hoặc ứng dụng cho vay mời vay với lãi suất ưu đãi,
  không cần thế chấp, thủ tục nhanh. Sau khi nạn nhân gửi thông tin, họ báo hồ sơ sai thông tin hoặc cần đóng
  phí hồ sơ, phí bảo hiểm khoản vay, phí xác minh, phí giải ngân, và yêu cầu chuyển trước vào một tài khoản cá nhân.
  Chuyển xong vẫn chưa nhận được tiền vay, lại bị báo lỗi và đòi chuyển thêm.
cac_buoc:
  - Quảng cáo hoặc nhắn tin mời vay nhanh, lãi thấp, không thế chấp
  - Hướng dẫn điền hồ sơ qua Zalo, link hoặc ứng dụng lạ
  - Báo cần nộp phí hoặc hồ sơ sai thông tin, yêu cầu chuyển tiền trước để được giải ngân
  - Tiếp tục báo lỗi, đòi chuyển thêm để "mở khóa khoản vay"
