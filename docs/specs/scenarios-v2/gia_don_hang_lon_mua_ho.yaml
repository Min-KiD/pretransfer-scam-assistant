dau_hieu:
  - Khách lạ xưng cơ quan, đơn vị đặt đơn rất lớn chỉ qua điện thoại hoặc Zalo
  - Nhờ mua hộ mặt hàng khác từ một đối tác do chính khách giới thiệu
  - Phải chuyển cọc cho bên thứ ba trước khi khách trả tiền
  - Giấy tờ đóng dấu, ảnh chuyển khoản chỉ gửi qua mạng
viec_can_kiem_tra:
  - Gọi số điện thoại chính thức của đơn vị đó để hỏi có người và đơn hàng này không
  - Mở app ngân hàng xem tiền khách báo đã chuyển có thật vào tài khoản chưa, không tin ảnh chụp
  - Không chuyển cọc cho bên thứ ba do khách giới thiệu
cau_noi_mau:
  - "Anh bên Bộ Chỉ huy quân sự tỉnh, đơn vị cần 50 bộ bàn ghế, em báo giá rồi anh chuyển khoản luôn."
  - "Đơn vị cần thêm 100 cái đệm, em lấy giúp bên anh Hùng này, cọc cho họ 30% trước, cuối tuần anh thanh toán cả thể."
