id: gia_don_hang_lon_mua_ho
ten: Giả cán bộ quân đội, bệnh viện, trường học đặt đơn hàng lớn, rồi nhờ chuyển tiền cho "nhà cung cấp"
nhom: lua_dao
nguon:
  - {noi: "Bộ Công an, 27/06/2026 (Công an tỉnh Bắc Ninh)", url: "https://bocongan.gov.vn/bai-viet/bac-ninh-xuat-hien-thu-doan-gia-danh-don-vi-quan-doi-dat-hang-de-lua-dao-1782814919", do_tin_cay: da_doc}
  - {noi: "Bộ Công an, 02/10/2026 (Công an phường Mạo Khê, Quảng Ninh)", url: "https://bocongan.gov.vn/bai-viet/quang-ninh-cong-an-phuong-mao-khe-kip-thoi-ngan-chan-nguy-co-lua-dao-qua-mang-voi-thu-doan-gia-danh-can-bo-benh-vien-dat-mua-hang-1790913523", do_tin_cay: da_doc}
mo_ta: >
  Nạn nhân là chủ cửa hàng, hộ kinh doanh. Một người lạ tự xưng cán bộ đơn vị quân đội, bệnh viện, trường học
  gọi hoặc nhắn đặt đơn hàng lớn, trả giá cao, gửi ảnh giấy tờ có dấu đỏ hoặc ảnh chuyển khoản giả để tạo lòng tin.
  Sau đó họ nhờ mua hộ thêm mặt hàng mà cửa hàng không bán (giường, đệm, thực phẩm, quà tặng) từ một "đối tác"
  do chính họ giới thiệu, hứa phần chênh lệch giá. "Đối tác" yêu cầu chuyển tiền cọc hoặc tiền "xác nhận giao dịch"
  trước, nhận tiền xong thì cắt liên lạc.
cac_buoc:
  - Gọi hoặc nhắn Zalo đặt hàng số lượng lớn, tự xưng cán bộ cơ quan, đơn vị
  - Gửi ảnh giấy giới thiệu, báo giá đóng dấu, hoặc ảnh chuyển khoản giả
  - Nhờ mua hộ mặt hàng khác từ một "nhà cung cấp" do họ giới thiệu, hứa chênh lệch giá
  - Bên "nhà cung cấp" yêu cầu chuyển cọc trước để giữ hàng, rồi chặn số
