dau_hieu:
  - Được rủ mở ví trả sau hoặc khoản vay, rồi chuyển chính số tiền vay đó cho người khác
  - Hứa hoa hồng và hứa "sẽ hủy khoản vay, không mất phí"
  - Lần đầu được trả lại để tạo lòng tin, sau đó đòi vay thêm, góp thêm
viec_can_kiem_tra:
  - Khoản ví trả sau, khoản vay đứng tên mình thì mình phải trả; không ai hủy hộ được
  - Hỏi tổng đài chính thức của ví hoặc ngân hàng về "chương trình hoa hồng" này
  - Không chuyển tiền vừa vay cho người lạ
cau_noi_mau:
  - "Bạn mở ví trả sau, được ứng 5 triệu thì quét mã này chuyển qua, bên mình trả lại 5,5 triệu và hủy khoản ứng cho bạn."
  - "Làm thêm 2 đơn nữa là đủ tiền mua iPhone, bạn vay nhanh thêm 10 triệu rồi chuyển vào đây nhé."
