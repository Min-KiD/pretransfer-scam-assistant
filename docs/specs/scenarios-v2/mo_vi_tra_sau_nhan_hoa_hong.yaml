id: mo_vi_tra_sau_nhan_hoa_hong
ten: Rủ mở ví trả sau, vay nhanh hoặc mua trả góp hộ để nhận hoa hồng
nhom: lua_dao
nguon:
  - {noi: "Tuổi Trẻ Online, 30/09/2025: Bùng phát nhiều chiêu trò lừa đảo qua ví điện tử", url: "https://tuoitre.vn/bung-phat-nhieu-chieu-tro-lua-dao-qua-vi-dien-tu-20250929224618381.htm", do_tin_cay: da_doc}
  - {noi: "Tuổi Trẻ Online, 10/05/2025", url: "https://tuoitre.vn/tin-loi-mo-the-nhan-hoa-hong-khong-mat-phi-co-gai-bi-lua-hon-tram-trieu-20250510185802022.htm", do_tin_cay: tim_kiem}
mo_ta: >
  Một người lạ trong hội nhóm mạng xã hội, hoặc một quảng cáo việc làm thêm, chỉ cách "kiếm tiền": mở ví trả sau,
  vay nhanh trên ví điện tử hoặc mua hàng trả góp, rồi quét mã QR chuyển số tiền vừa được ứng vào tài khoản họ đưa
  để nhận hoa hồng. Họ hứa sẽ hủy khoản vay sau nên người mở không mất gì. Lần đầu có thể được trả lại kèm hoa hồng,
  sau đó bị dụ góp thêm rồi mất liên lạc; khoản nợ vẫn đứng tên nạn nhân.
cac_buoc:
  - Nhắn tin riêng hoặc đăng bài rủ làm việc nhẹ, nhận hoa hồng khi mở ví trả sau, mở thẻ, vay nhanh
  - Hướng dẫn đăng ký ví trả sau hoặc khoản vay đứng tên nạn nhân
  - Bảo quét mã QR chuyển số tiền được ứng vào tài khoản cá nhân, hứa hủy khoản vay
  - Trả hoa hồng lần đầu, rồi dụ vay thêm, góp thêm; sau đó cắt liên lạc
