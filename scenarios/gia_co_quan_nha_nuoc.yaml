id: gia_co_quan_nha_nuoc
ten: Giả cán bộ thuế, điện lực, định danh VNeID yêu cầu cài app, nộp lệ phí
nhom: lua_dao
nguon:
  - {noi: "Tạp chí An ninh mạng 07/11/2026: giả danh cán bộ thuế, dụ cài ứng dụng (Công an Đồng Nai cảnh báo)", url: "https://tapchianninhmang.vn/gia-danh-can-bo-thue-du-cai-ung-dung-vet-sach-tai-khoan", do_tin_cay: tim_kiem}
  - {noi: "Công an TP. Hà Nội qua LSVN 12/11/2026: lợi dụng quy định xác thực định danh điện tử", url: "http://lsvn.vn/canh-bao-thu-doan-loi-dung-quy-dinh-xac-thuc-dinh-danh-dien-tu-de-lua-dao-a182493.html", do_tin_cay: tim_kiem}
mo_ta: >
  Người lạ gọi tự xưng cán bộ thuế, điện lực, công an phường, văn phòng đất đai. Báo cần cập nhật thông tin,
  hoàn thuế, tích hợp giấy tờ trên VNeID, hoặc sắp bị cắt điện. Hướng dẫn cài ứng dụng ngoài kho chính thức,
  rồi yêu cầu chuyển một khoản lệ phí nhỏ để "kích hoạt". App giả chiếm quyền điện thoại.
cac_buoc:
  - Gọi điện, kết bạn Zalo bằng tài khoản có logo cơ quan
  - Gửi link tải ứng dụng giả dịch vụ công
  - Yêu cầu nộp lệ phí nhỏ hoặc nhập thông tin ngân hàng trong app
