  da_gap_truc_tiep: {khong: 0.95}
  da_chuyen_truoc_do: {khong: 0.85}
dau_hieu:
  - Cơ quan nhà nước hướng dẫn cài app qua link gửi trong Zalo
  - Lệ phí chuyển vào tài khoản cá nhân
  - Dọa cắt điện, phạt, khóa mã số thuế trong ngày
viec_can_kiem_tra:
  - Chỉ cài VNeID, eTax Mobile từ App Store hoặc Google Play
  - Tự đến trụ sở hoặc gọi số trên website chính thức của cơ quan đó
cau_noi_mau:
  - "Anh chưa đồng bộ mã số thuế với căn cước, hôm nay không làm sẽ bị phạt. Anh kết bạn Zalo em gửi link cài app."
  - "Chị chuyển 12.000đ lệ phí kích hoạt qua app để hồ sơ được duyệt."
