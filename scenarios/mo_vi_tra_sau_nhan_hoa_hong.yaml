id: mo_vi_tra_sau_nhan_hoa_hong
ten: Rủ mở ví trả sau, vay nhanh hoặc mua trả góp rồi chuyển số tiền đó đi để nhận hoa hồng
nhom: lua_dao
nguon:
  - {noi: "Tuổi Trẻ Online, 30/09/2025: Bùng phát nhiều chiêu trò lừa đảo qua ví điện tử", url: "https://tuoitre.vn/bung-phat-nhieu-chieu-tro-lua-dao-qua-vi-dien-tu-20250929224618381.htm", do_tin_cay: da_doc}
  - {noi: "Tuổi Trẻ Online, 10/05/2025 (Công an Đà Nẵng)", url: "https://tuoitre.vn/tin-loi-mo-the-nhan-hoa-hong-khong-mat-phi-co-gai-bi-lua-hon-tram-trieu-20250510185802022.htm", do_tin_cay: da_doc}
mo_ta: >
  Một người lạ trong hội nhóm mạng xã hội, hoặc một nhóm tuyển người làm thêm, chỉ cách "kiếm tiền" hay "mua đồ giá ưu đãi":
  mở ví trả sau, vay nhanh trên ví điện tử hoặc mua hàng trả góp, rồi quét mã QR chuyển chính số tiền vừa được ứng vào
  tài khoản hoặc "dịch vụ trả góp có hoa hồng" họ đưa. Họ hứa sẽ hủy đơn, hủy khoản vay nên người mở không mất gì, lại được
  hoa hồng. Lần đầu có thể được trả lại kèm hoa hồng để tạo lòng tin, sau đó bị dụ vay thêm, mượn thêm người quen để góp tiếp;
  cuối cùng họ cắt liên lạc, khoản nợ vẫn đứng tên nạn nhân.
cac_buoc:
  - Nhắn tin riêng hoặc đăng bài tìm người làm thêm, chia sẻ "bí kíp" kiếm tiền qua ví trả sau, vay nhanh, mở thẻ
  - Hướng dẫn đăng ký ví trả sau hoặc khoản vay đứng tên nạn nhân
  - Bảo quét mã QR chuyển số tiền được ứng vào tài khoản cá nhân hoặc "dịch vụ trả góp có hoa hồng", hứa hủy khoản vay
  - Trả lại tiền kèm hoa hồng lần đầu, rồi dụ vay thêm, mượn thêm để góp tiếp; sau đó cắt liên lạc
