  da_chuyen_truoc_do: {khong: 0.9}
dau_hieu:
  - Yêu cầu hoàn vào tài khoản khác với tài khoản đã chuyển tới
  - Gửi link hoặc mã QR để "nhận lại tiền"
  - Đòi thêm tiền lãi
viec_can_kiem_tra:
  - Không tự chuyển lại. Báo ngân hàng hoặc ví để họ hoàn về đúng tài khoản gốc
  - So số tài khoản được yêu cầu hoàn với số tài khoản đã gửi tiền tới
cau_noi_mau:
  - "Em chuyển nhầm cho chị 5 triệu, chị chuyển lại giúp em vào stk này nhé, stk kia em bị khóa rồi."
  - "Chị quét mã QR này để hoàn tiền cho nhanh ạ, em đang cần gấp đóng viện phí."
