id: chuyen_nham_tien
ten: Cố ý "chuyển nhầm" tiền rồi đòi hoàn vào tài khoản khác hoặc đòi lãi
nhom: lua_dao
nguon:
  - {noi: "Công an tỉnh Phú Thọ: thủ đoạn chuyển tiền nhầm", url: "https://congan.phutho.gov.vn/article/Canh-giac-thu-doan-chuyen-tien-nham-de-lua-dao-27635-34", do_tin_cay: tim_kiem}
  - {noi: "Znews 19/11/2026: chiêu lừa mới từ chuyển khoản qua mã QR", url: "https://znews.vn/canh-bao-chieu-lua-moi-tu-chuyen-khoan-qua-ma-qr-post1697650.html", do_tin_cay: tim_kiem}
mo_ta: >
  Nạn nhân nhận một khoản tiền từ người lạ, nội dung ghi "cho vay" hoặc để trống. Người lạ liên lạc xin hoàn lại,
  nhưng yêu cầu chuyển vào một tài khoản khác với tài khoản đã gửi, hoặc gửi mã QR, link để "nhận lại".
  Biến thể: sau đó coi khoản tiền là khoản vay, đòi lãi và dọa.
cac_buoc:
  - Tiền lạ vào tài khoản nạn nhân
  - Người lạ gọi hoặc nhắn xin lại, tỏ ra gấp
  - Đưa số tài khoản khác, mã QR hoặc link để hoàn tiền
  - Nếu không trả ngay thì dọa báo công an hoặc đòi lãi
