dau_hieu:
  - Shipper không gặp mặt mà đòi chuyển khoản trước
  - Tài khoản nhận là cá nhân, không phải hãng vận chuyển
  - Sau khi chuyển lại bị báo lỗi và đòi chuyển thêm
viec_can_kiem_tra:
  - Mở app mua hàng xem có đơn nào đang giao, mã đơn và số tiền có trùng không
  - Chỉ trả tiền khi đã cầm hàng
  - Tự tra số tổng đài trên website hãng vận chuyển, không gọi số người kia đưa
cau_noi_mau:
  - "Em shipper đây chị, chị có đơn 185k mà không có nhà, chị ck em gửi hàng ở cổng nhé."
  - "Chị ơi chị chuyển nhầm vào stk đăng ký hội viên giao hàng rồi, không hủy là mỗi tháng trừ 3 triệu đó."
