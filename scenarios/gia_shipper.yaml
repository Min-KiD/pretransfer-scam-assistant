id: gia_shipper
ten: Giả shipper đòi tiền hàng, rồi báo "chuyển nhầm" để đòi chuyển thêm
nhom: lua_dao
nguon:
  - {noi: "Công an tỉnh Ninh Bình, 10/06/2026", url: "https://congan.ninhbinh.gov.vn/luc-luong-cong-an-canh-bao-thu-doan-gia-danh-shipper-de-lua-dao-chiem-doat-tai-san", do_tin_cay: da_doc}
  - {noi: "Công an tỉnh Vĩnh Long 06/11/2026, qua CafeF 10/11/2026", url: "https://cafef.vn/vua-chuyen-khoan-tra-tien-hang-shipper-bao-chuyen-nham-cong-an-canh-bao-cuoc-goi-tiep-theo-188261110065234119.chn", do_tin_cay: da_doc}
mo_ta: >
  Người lạ tự xưng nhân viên giao hàng, gọi lúc nạn nhân vắng nhà, đề nghị chuyển khoản trước để gửi hàng lại.
  Sau khi nhận tiền, báo nạn nhân đã chuyển nhầm vào "tài khoản đăng ký shipper", đưa số "tổng đài" để hủy,
  rồi đòi chuyển thêm nhiều lần với lý do giao dịch lỗi, sai cú pháp.
cac_buoc:
  - Gọi hoặc nhắn báo có đơn hàng, hỏi có ở nhà không
  - Đề nghị chuyển khoản tiền hàng hoặc phí vào tài khoản cá nhân
  - Báo chuyển nhầm vào tài khoản đăng ký dịch vụ, dọa bị trừ tiền hằng tháng
  - Đưa số điện thoại hoặc link "tổng đài hỗ trợ hủy"
  - Đòi chuyển thêm để hủy, sửa lỗi, nhận hoàn tiền
