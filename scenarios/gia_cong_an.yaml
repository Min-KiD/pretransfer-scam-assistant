id: gia_cong_an
ten: Giả công an, viện kiểm sát yêu cầu chuyển tiền để "xác minh vụ án"
nhom: lua_dao
nguon:
  - {noi: "Bộ Công an: Công an xã ở Hà Tĩnh ngăn vụ 921 triệu đồng", url: "https://www.mps.gov.vn/bai-viet/ha-tinh-cong-an-xa-kip-thoi-ngan-chan-vu-lua-dao-bao-toan-921-trieu-dong-cho-nguoi-dan-1793759617", do_tin_cay: tim_kiem}
  - {noi: "Công an tỉnh Đắk Lắk: cuộc gọi giả danh công an yêu cầu chuyển tiền để xác minh vụ án", url: "https://congan.daklak.gov.vn/hoat-dong-cua-dia-phuong/canh-giac-cuoc-goi-gia-danh-cong-an-yeu-cau-chuyen-tien-de-xac-minh-vu-an-15052.html", do_tin_cay: tim_kiem}
mo_ta: >
  Người lạ gọi điện tự xưng cán bộ công an, viện kiểm sát, báo nạn nhân liên quan đến vụ án rửa tiền hoặc khoản nợ lớn.
  Yêu cầu giữ bí mật tuyệt đối, khai tài sản, rồi chuyển toàn bộ tiền vào tài khoản do họ chỉ định để "xác minh".
cac_buoc:
  - Gọi điện báo liên quan vụ án, đọc đúng tên và số căn cước
  - Chuyển máy cho "cán bộ điều tra", gọi video mặc sắc phục, gửi "lệnh bắt"
  - Yêu cầu không nói với ai, kể cả người nhà và nhân viên ngân hàng
  - Yêu cầu chuyển tiền vào "tài khoản an toàn" hoặc tài khoản "tạm giữ"
