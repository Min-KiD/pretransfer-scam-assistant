dau_hieu:
  - Làm việc qua điện thoại, không có giấy mời đến trụ sở
  - Yêu cầu giữ bí mật với người nhà
  - Yêu cầu chuyển tiền vào tài khoản cá nhân
viec_can_kiem_tra:
  - Cúp máy, tự đến hoặc tự gọi công an xã, phường nơi mình ở
  - Hỏi một người thân trước khi chuyển
cau_noi_mau:
  - "Tôi là thượng úy Nam, anh đang liên quan đường dây rửa tiền. Việc này anh tuyệt đối không được nói với ai."
  - "Anh chuyển toàn bộ số dư vào tài khoản tạm giữ của cơ quan điều tra, 24 giờ sau xác minh xong sẽ hoàn lại."
