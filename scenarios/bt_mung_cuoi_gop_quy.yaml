  loai_tai_khoan: {ca_nhan: 0.97}
  ten_khop_tu_xung: {co: 0.9}
  da_gap_truc_tiep: {co: 0.9}
  duoc_dan_cach_tra_loi: {khong: 0.99}
  mau_thuan_loi_ke_va_anh: {khong: 0.97}
  da_chuyen_truoc_do: {khong: 0.85}
dau_hieu:
  - Người nhận là người quen ngoài đời, tài khoản đứng tên chính người đó
  - Lý do rõ ràng (đám cưới, đám tang, quỹ chung), nhiều người quen cùng biết
  - Số tiền nhỏ, không bị giục chuyển ngay
viec_can_kiem_tra:
  - Đối chiếu tên chủ tài khoản với tên người quen
  - Nếu chỉ nhận được một tin nhắn riêng mượn tiền gấp thì gọi điện cho người đó trước
cau_noi_mau:
  - "Tuần sau đám cưới Lan mà mình bận không về được, gửi mừng qua số tài khoản in trên thiệp."
  - "Cả lớp góp quỹ liên hoan mỗi người 200k, chuyển cho lớp trưởng nhé."
