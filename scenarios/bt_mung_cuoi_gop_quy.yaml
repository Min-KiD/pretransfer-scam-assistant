id: bt_mung_cuoi_gop_quy
ten: Mừng cưới, phúng viếng, góp quỹ lớp, quỹ nhóm cho người quen
nhom: binh_thuong
doi_chieu_voi: mao_danh_nguoi_quen
nguon:
  - {noi: "Tự viết", url: "", do_tin_cay: tu_viet}
mo_ta: >
  Người dùng chuyển tiền mừng cưới, phúng viếng, mừng sinh nhật, hoặc góp quỹ lớp, quỹ nhóm, tiền ăn chung.
  Số tài khoản in trên thiệp, do người quen đưa trực tiếp, hoặc đăng trong nhóm chat chung có nhiều người quen
  cùng chuyển. Số tiền nhỏ, không ai giục gấp, không ai nhờ chuyển vào tài khoản của người thứ ba.
cac_buoc:
  - Người quen gửi thiệp, hoặc trưởng nhóm thông báo thu quỹ trong nhóm chat chung
  - Người dùng chuyển vào tài khoản đứng tên chính người đó
truong:
  nguoi_lien_lac: {nguoi_quen: 0.97}
  kenh: {zalo: 0.45, truc_tiep: 0.3, messenger: 0.2}
  tu_xung: {nguoi_than: 0.95}
  ai_bat_dau: {ho_truoc: 0.55, minh_truoc: 0.45}
  ap_luc: {khong_co: 0.9, hoi_thuc: 0.08}
  yeu_cau: {chuyen_tien: 0.98}
