id: dich_vu_lay_lai_tien
ten: Dịch vụ "lấy lại tiền bị lừa" thu phí trước
nhom: lua_dao
nguon:
  - {noi: "An ninh Thủ đô 19/10/2026: thủ đoạn lừa đảo lấy lại tiền đã mất", url: "https://anninhthudo.vn/canh-giac-thu-doan-lua-dao-lay-lai-tien-da-mat-post672448.antd", do_tin_cay: tim_kiem}
  - {noi: "Công an tỉnh Khánh Hòa: giả mạo trang Công an, Luật sư thu hồi tiền lừa đảo", url: "https://congan.khanhhoa.gov.vn/vi/thu-doan-gia-mao-trang-cong-an-luat-su-thu-hoi-tien-lua-dao-de-chiem-doat-tai-san", do_tin_cay: tim_kiem}
mo_ta: >
  Người vừa bị lừa lên mạng tìm cách lấy lại tiền, gặp trang tự xưng luật sư, công an, "chuyên gia an ninh mạng"
  cam kết thu hồi. Họ đòi phí hồ sơ, tiền cọc, phí "phá băng tài khoản" trước khi làm.
cac_buoc:
  - Nạn nhân tìm thấy quảng cáo hoặc trang "hỗ trợ thu hồi tiền treo"
  - Được hỏi chi tiết vụ bị lừa, cam kết lấy lại 100%
  - Đòi phí trước, sau đó phát sinh thêm phí
