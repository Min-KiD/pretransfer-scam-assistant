dau_hieu:
  - Cam kết lấy lại 100% tiền đã mất
  - Thu phí trước qua chuyển khoản cá nhân
  - Chỉ làm việc qua mạng, không có văn phòng để đến
viec_can_kiem_tra:
  - Trình báo trực tiếp tại công an nơi ở; cơ quan công an không thu phí thu hồi tiền
  - Tra tên luật sư trên danh sách của Liên đoàn Luật sư Việt Nam
cau_noi_mau:
  - "Bên em cam kết thu hồi 100% trong 24h, không được hoàn phí. Chị đóng trước 10% phí hồ sơ."
  - "Tiền của anh đang bị treo trên hệ thống, cần 8tr phí phá băng để giải ngân về."
