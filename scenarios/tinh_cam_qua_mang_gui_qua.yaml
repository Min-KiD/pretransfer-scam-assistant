dau_hieu:
  - Người quen qua mạng, chưa từng gặp, tự nhận là người nước ngoài
  - Hứa tặng quà hoặc tiền giá trị rất lớn, rồi phát sinh phí phải đóng trước
  - Phí hải quan, thuế, tiền phạt lại chuyển vào tài khoản cá nhân
  - Người dùng phải rút sổ tiết kiệm, bán đồ hoặc đi vay để nộp phí
  - Chuyển xong lại bị đòi thêm khoản khác
viec_can_kiem_tra:
  - Hải quan, công an cửa khẩu và hãng vận chuyển không thu phí qua tài khoản cá nhân; tự tra mã vận đơn trên website của hãng
  - Đề nghị gọi video trực tiếp và hỏi ý kiến người thân trước khi chuyển
  - Không chuyển tiền để được nhận quà hay nhận tiền
cau_noi_mau:
  - "Em à, quà anh gửi đã về sân bay Tân Sơn Nhất rồi, em đóng giúp anh 28 triệu phí thông quan để họ giao nhé."
  - "Anh ấy đang bị giữ ở sân bay Nội Bài vì mang nhiều ngoại tệ, chị chuyển 28 triệu đóng thuế thì mới làm xong thủ tục."
