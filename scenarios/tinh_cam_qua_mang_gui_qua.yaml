id: tinh_cam_qua_mang_gui_qua
ten: Quen qua mạng, hứa gửi quà hoặc tiền từ nước ngoài, rồi đòi phí hải quan, phí nhận hàng
nhom: lua_dao
nguon:
  - {noi: "Báo Gia Lai, 08/11/2026 (Công an xã Đak Đoa)", url: "https://baogialai.com.vn/cong-an-xa-dak-doa-kip-thoi-ngan-chan-vu-lua-dao-post604260.html", do_tin_cay: da_doc}
  - {noi: "Kenh14 theo An ninh tiền tệ, 23/10/2026 (ba vụ ở Tuyên Quang, Hải Phòng, Hà Nội)", url: "https://kenh14.vn/can-bo-ngan-hang-dung-loat-lenh-chuyen-tien-rut-truoc-han-so-tiet-kiem-tu-28-trieu-90-trieu-den-380-trieu-dong-khach-hang-sau-do-cam-on-dung-giao-dich-215261023203042579.chn", do_tin_cay: da_doc}
  - {noi: "Tạp chí Hàng không, 01/11/2026 (Công an cửa khẩu Nội Bài)", url: "https://tapchihangkhong.vn/cong-an-cua-khau-noi-bai-bao-thu-doan-nguoi-nuoc-ngoai-bi-tam-giu-tai-san-bay-d15221.html", do_tin_cay: da_doc}
mo_ta: >
  Một tài khoản mạng xã hội tự giới thiệu là người nước ngoài (người Hàn Quốc, bác sĩ người Đức...) nhắn tin làm quen,
  tỏ tình cảm trong vài ngày đến vài tuần. Sau đó báo đã gửi thùng quà đắt tiền, trang sức, ngoại tệ, hoặc báo sẽ sang
  Việt Nam thăm. Khi quà "về đến sân bay" hoặc người đó "bị tạm giữ ở sân bay", chính người đó hoặc một người khác gọi đến
  yêu cầu chuyển phí thông quan, phí vận chuyển, thuế, tiền phạt vào một tài khoản cá nhân.
  Chuyển xong có thể bị đòi thêm hoặc bị cắt liên lạc.
cac_buoc:
  - Kết bạn, nhắn tin hằng ngày, tạo quan hệ tình cảm; chưa từng gặp ngoài đời
  - Gửi ảnh quà đắt tiền, ngoại tệ, vé máy bay; báo quà đã về sân bay hoặc mình bị giữ ở sân bay
  - Yêu cầu chuyển phí hải quan, phí vận chuyển, thuế, tiền phạt vào tài khoản cá nhân
  - Nhận tiền xong đòi thêm khoản khác hoặc cắt liên lạc
