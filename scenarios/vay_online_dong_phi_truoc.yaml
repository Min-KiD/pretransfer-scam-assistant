dau_hieu:
  - Chưa nhận được tiền vay mà đã phải nộp phí
  - Phí nộp vào tài khoản cá nhân, không phải tài khoản của ngân hàng hay công ty tài chính
  - Viện lý do chỉnh sửa thông tin, xác minh hồ sơ để đòi chuyển tiền trước
viec_can_kiem_tra:
  - Ngân hàng và công ty tài chính có giấy phép không thu phí trước khi giải ngân qua tài khoản cá nhân
  - Tự gọi tổng đài chính thức hoặc ra chi nhánh hỏi về khoản vay này
  - Không cài ứng dụng vay từ link người lạ gửi
cau_noi_mau:
  - "Hồ sơ vay 50 triệu của chị đã duyệt, chị chuyển trước 5 triệu phí bảo hiểm khoản vay để bên em giải ngân."
  - "Em cần chị chuyển trước 5 triệu để chỉnh sửa thông tin cá nhân cho đủ điều kiện giải ngân khoản vay 50 triệu."
