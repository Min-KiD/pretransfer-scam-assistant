id: vay_online_dong_phi_truoc
ten: Mời vay tiền online lãi thấp, đòi nộp phí trước thì mới giải ngân
nhom: lua_dao
nguon:
  - {noi: "Bộ Công an, 31/10/2026 (Công an xã Lạc Sơn, Phú Thọ)", url: "https://www.bocongan.gov.vn/bai-viet/phu-tho-cong-an-xa-lac-son-kip-thoi-ngan-chan-vu-lua-dao-gia-danh-nhan-vien-ngan-hang-1793435269", do_tin_cay: da_doc}
  - {noi: "Công an tỉnh Cà Mau, 12/07/2026: lừa đảo vay tiền qua ứng dụng", url: "https://congan.camau.gov.vn/ch26/1357-Canh-giac-voi-thu-doan-lua-dao-vay-tien-qua-ung-dung-va-dau-tu-sinh-loi-tren-mang-xa-hoi.html", do_tin_cay: da_doc}
  - {noi: "CafeF, 14/07/2026: Công an cảnh báo tuyệt đối không chuyển tiền trước để làm thủ tục vay", url: "https://cafef.vn/cong-an-canh-bao-tuyet-doi-khong-chuyen-tien-truoc-de-lam-thu-tuc-vay-188260714090725473.chn", do_tin_cay: tim_kiem}
mo_ta: >
  Một người quen qua mạng xã hội, hoặc người tự xưng nhân viên ngân hàng, công ty tài chính, ứng dụng cho vay, mời vay
  với lãi suất ưu đãi, không cần thế chấp, giải ngân nhanh. Khi nạn nhân nhờ làm hồ sơ, họ yêu cầu chuyển trước một khoản
  vào tài khoản cá nhân với lý do phí hồ sơ, phí xác minh, phí bảo hiểm khoản vay, "chỉnh sửa thông tin" hoặc phí giải ngân.
  Chưa nhận được tiền vay mà đã phải nộp tiền; có thể bị đòi thêm nhiều lần.
cac_buoc:
  - Làm quen qua mạng xã hội, quảng cáo hoặc nhắn tin mời vay nhanh, lãi thấp, không thế chấp
  - Nhận hồ sơ vay, có khi bảo tải ứng dụng lạ, gửi ảnh căn cước
  - Yêu cầu chuyển trước phí hồ sơ, phí xác minh, phí bảo hiểm hoặc phí giải ngân vào tài khoản cá nhân
  - Nếu nạn nhân chuyển thì tiếp tục viện lý do khác để đòi thêm
