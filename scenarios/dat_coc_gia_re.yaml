dau_hieu:
  - Giá thấp hơn hẳn thị trường
  - Thương hiệu lớn nhưng nhận tiền vào tài khoản cá nhân
  - Giục cọc trong vài phút
viec_can_kiem_tra:
  - Vào website chính thức của hãng, khách sạn để lấy số liên hệ và hỏi lại
  - Xem lịch sử đổi tên của fanpage
cau_noi_mau:
