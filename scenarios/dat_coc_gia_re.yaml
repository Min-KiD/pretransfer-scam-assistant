id: dat_coc_gia_re
ten: Đặt cọc combo du lịch, vé máy bay, hàng giá rẻ trên trang giả
nhom: lua_dao
nguon:
  - {noi: "Bộ Công an: cảnh báo thủ đoạn lừa đảo mùa du lịch", url: "https://bocongan.gov.vn/bai-viet/canh-bao-thu-doan-lua-dao-mua-du-lich-1775739673", do_tin_cay: tim_kiem}
  - {noi: "Công an TP. Cần Thơ: lừa đảo đặt tour, phòng khách sạn giá rẻ trên mạng xã hội", url: "https://congan.cantho.gov.vn/thong-bao/canh-giac-voi-thu-doan-lua-dao-dat-tour-du-lich-phong-khach-san-gia-re-tren-mang-xa-hoi-7789.html", do_tin_cay: tim_kiem}
mo_ta: >
  Nạn nhân tự tìm đến một fanpage hoặc website bán combo du lịch, vé máy bay, điện thoại giá rẻ bất thường.
  Trang giả mạo thương hiệu thật, có tích xanh mua lại. Yêu cầu cọc 30-50% hoặc trả đủ để "giữ chỗ" vì sắp hết suất.
  Sau khi chuyển thì bị chặn, hoặc bị báo lỗi và đòi chuyển lại.
cac_buoc:
  - Nạn nhân thấy quảng cáo, nhắn hỏi
  - Được tư vấn nhanh, gửi "mã giữ chỗ", "hợp đồng"
  - Giục cọc ngay vì chỉ còn vài suất
  - Chặn liên lạc, hoặc báo sai cú pháp để đòi chuyển thêm
