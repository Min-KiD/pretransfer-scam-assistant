id: bt_hoa_don_to_chuc
ten: Đóng học phí, viện phí, tiền điện nước, lệ phí cho tổ chức theo thông báo chính thức
nhom: binh_thuong
doi_chieu_voi: gia_co_quan_nha_nuoc
nguon:
  - {noi: "Tự viết", url: "", do_tin_cay: tu_viet}
mo_ta: >
  Người dùng tự đóng một khoản đã biết trước cho trường học, bệnh viện, ban quản lý chung cư, công ty điện nước
  hoặc cơ quan nhà nước. Số tiền và số tài khoản lấy từ thông báo, hóa đơn, quầy thu hoặc cổng thanh toán chính thức.
  Tài khoản nhận là tài khoản tổ chức, tên khớp. Đây là kỳ đóng đã định sẵn, không phải khoản bị đòi thêm.
  Không ai gọi điện giục, không ai bảo cài ứng dụng hay bấm link.
cac_buoc:
  - Người dùng nhận hóa đơn, thông báo thu định kỳ, hoặc được báo số tiền tại quầy
  - Tự mở app chuyển khoản vào tài khoản tổ chức ghi trên hóa đơn, thông báo
truong:
  nguoi_lien_lac: {tu_tim_den: 0.85, nguoi_quen: 0.1}
  kenh: {truc_tiep: 0.55, zalo: 0.2, sms: 0.15}
  tu_xung: {to_chuc_dich_vu: 0.5, giao_vien_y_te: 0.25, co_quan_nha_nuoc: 0.2}
  ai_bat_dau: {minh_truoc: 0.75, ho_truoc: 0.25}
  ap_luc: {khong_co: 0.9, hoi_thuc: 0.08}
  yeu_cau: {chuyen_tien: 0.98}
  ly_do_tien: {hoa_don: 0.7, vien_phi: 0.15, phi: 0.12}
  loai_tai_khoan: {to_chuc: 0.92, ca_nhan: 0.08}
  ten_khop_tu_xung: {co: 0.95}
  da_gap_truc_tiep: {co: 0.7, khong: 0.3}
  duoc_dan_cach_tra_loi: {khong: 0.99}
  mau_thuan_loi_ke_va_anh: {khong: 0.97}
  da_chuyen_truoc_do: {khong: 0.85}
dau_hieu:
  - Khoản phải đóng đã biết trước, có hóa đơn hoặc thông báo từ kênh chính thức
  - Tài khoản nhận là tổ chức, tên khớp với nơi thu
  - Không ai gọi giục, không bị yêu cầu cài ứng dụng hay đọc mã OTP
viec_can_kiem_tra:
  - Đối chiếu số tài khoản với hóa đơn giấy, website hoặc quầy thu chính thức
  - Tên chủ tài khoản hiện trên màn hình xác nhận phải đúng tên nơi thu
  - Nếu số tài khoản đến từ một cuộc gọi hay tin nhắn lạ thì tự gọi lại nơi thu để hỏi
cau_noi_mau:
  - "Nhà trường thông báo học phí học kỳ 2 là 4.200.000đ, phụ huynh chuyển khoản vào tài khoản của trường ghi trên phiếu thu."
