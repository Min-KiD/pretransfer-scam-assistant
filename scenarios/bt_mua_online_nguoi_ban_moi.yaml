  ly_do_tien: {tra_hang: 0.6, dat_coc: 0.35}
  loai_tai_khoan: {ca_nhan: 0.8, to_chuc: 0.2}
  ten_khop_tu_xung: {co: 0.6, khong: 0.4}
  da_gap_truc_tiep: {khong: 0.95}
  duoc_dan_cach_tra_loi: {khong: 0.99}
  mau_thuan_loi_ke_va_anh: {khong: 0.95}
  da_chuyen_truoc_do: {khong: 0.9}
dau_hieu:
  - Giá ngang thị trường, shop không giục
  - Shop có lịch sử bán hàng và đánh giá lâu năm
viec_can_kiem_tra:
  - Hỏi shop có cho nhận hàng rồi mới trả tiền (COD) không
  - Xem trang có đổi tên gần đây không, đánh giá có thật không
cau_noi_mau:
  - "Áo này 320k chị nhé, bên em nhận ck trước rồi gửi, ship 2-3 ngày ạ."
