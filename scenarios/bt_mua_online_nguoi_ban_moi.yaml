id: bt_mua_online_nguoi_ban_moi
ten: Mua hàng online của người bán chưa từng mua, chuyển khoản trước
nhom: binh_thuong
kho_phan_biet_voi: dat_coc_gia_re
nguon:
  - {noi: "Tự viết", url: "", do_tin_cay: tu_viet}
mo_ta: >
  Người dùng tự tìm một shop nhỏ trên Facebook, Zalo, hỏi mua và chuyển khoản trước theo yêu cầu của shop.
  Phần lớn là giao dịch thật, nhưng chỉ từ lời kể thì không tách được khỏi "đặt cọc giá rẻ".
  Kịch bản này có mặt để đo: với tình huống này, kết luận mong đợi là "chưa đủ căn cứ" kèm việc cần kiểm tra,
  không phải "bình thường" và cũng không phải "lừa đảo".
cac_buoc:
  - Người dùng thấy sản phẩm, nhắn hỏi shop
  - Shop báo giá, gửi số tài khoản, yêu cầu chuyển trước mới gửi hàng
truong:
  nguoi_lien_lac: {tu_tim_den: 0.95}
  kenh: {messenger: 0.5, zalo: 0.4}
  tu_xung: {nguoi_ban: 0.98}
