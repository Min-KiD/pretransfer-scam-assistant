  yeu_cau: {chuyen_tien: 0.95, cai_app: 0.5, bam_link: 0.5, nap_them_de_rut: 0.5}
  ly_do_tien: {dau_tu: 0.7, phi: 0.25}
  loai_tai_khoan: {ca_nhan: 0.7, to_chuc: 0.3}
  ten_khop_tu_xung: {khong: 0.85}
  da_gap_truc_tiep: {khong: 0.95}
  da_chuyen_truoc_do: {co: 0.7}
dau_hieu:
  - Cam kết lãi cao, không rủi ro
  - Nạp tiền bằng chuyển khoản vào tài khoản cá nhân hoặc công ty không liên quan
  - Muốn rút phải nộp thêm tiền
viec_can_kiem_tra:
  - Tra tên công ty trong danh sách được Ủy ban Chứng khoán Nhà nước cấp phép
  - Công ty chứng khoán thật chỉ nhận tiền vào tài khoản đứng tên chính công ty đó
cau_noi_mau:
  - "Mã này thầy báo chốt lãi 18% trong tuần, ai chưa vào thì nạp trước 15h hôm nay."
  - "Tài khoản của chị lãi 240 triệu, cần nộp 10% thuế TNCN trước khi hệ thống cho rút."
