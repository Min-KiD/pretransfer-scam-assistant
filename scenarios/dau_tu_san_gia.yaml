id: dau_tu_san_gia
ten: Dụ đầu tư chứng khoán, tiền ảo, ngoại hối trên sàn giả
nhom: lua_dao
nguon:
  - {noi: "Công an tỉnh Ninh Bình 20/05/2026: dụ dỗ đầu tư tài chính, sàn chứng khoán, tiền ảo", url: "https://congan.ninhbinh.gov.vn/canh-bao-thu-doan-du-do-tham-gia-dau-tu-tai-chinh-san-chung-khoan-tien-ao-tren-khong-gian-mang", do_tin_cay: tim_kiem}
  - {noi: "Bộ Công an: lừa đảo qua hội nhóm, nhóm chat đầu tư chứng khoán", url: "https://bocongan.gov.vn/bai-viet/canh-bao-thu-doan-lua-dao-thong-qua-cac-hoi-nhom-nhom-chat-dau-tu-chung-khoan-d2-t38878", do_tin_cay: tim_kiem}
mo_ta: >
  Nạn nhân được mời vào nhóm đầu tư có "chuyên gia" đọc lệnh, hoặc quen một người qua mạng rồi được rủ đầu tư.
  Nạp tiền vào app hoặc website lạ, thấy lãi trên màn hình, có thể rút được khoản nhỏ lúc đầu.
  Khi nạp lớn và muốn rút thì bị đòi đóng thuế, phí, tiền ký quỹ.
cac_buoc:
  - Làm quen qua mạng xã hội hoặc kéo vào nhóm "khuyến nghị"
  - Hướng dẫn mở tài khoản trên sàn lạ, nạp khoản nhỏ có lãi
  - Thúc nạp khoản lớn để "kịp sóng"
  - Không cho rút, đòi nộp thuế thu nhập, phí xác minh
truong:
  nguoi_lien_lac: {nguoi_la: 0.9, nguoi_quen: 0.1}
  kenh: {zalo: 0.4, telegram: 0.35, messenger: 0.2}
