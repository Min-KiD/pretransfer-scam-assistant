id: gia_ngan_hang
ten: "Giả nhân viên ngân hàng, ví điện tử: nâng hạn mức, khóa tài khoản, xác thực"
nhom: lua_dao
nguon:
  - {noi: "Công an tỉnh Tây Ninh 03/11/2026: mạo danh nhân viên ngân hàng nâng hạn mức thẻ tín dụng", url: "https://congan.tayninh.gov.vn/vi/chi-tiet-tin-tuc?Id=267994", do_tin_cay: tim_kiem}
  - {noi: "Công an tỉnh Khánh Hòa: lừa đảo mạo danh hoạt động của ngân hàng", url: "https://congan.khanhhoa.gov.vn/vi/canh-giac-thu-doan-lua-dao-mao-danh-hoat-dong-cua-ngan-hang", do_tin_cay: tim_kiem}
mo_ta: >
  Người lạ gọi hoặc nhắn tự xưng nhân viên ngân hàng, ví điện tử. Báo tài khoản sắp bị khóa, có giao dịch lạ,
  hoặc mời nâng hạn mức, hoàn phí thường niên. Yêu cầu bấm link, đọc mã OTP, quét khuôn mặt,
  hoặc chuyển một khoản để "xác minh tài khoản", "chứng minh thu nhập".
cac_buoc:
  - Gọi điện đọc đúng tên, vài số thẻ để tạo lòng tin
  - Báo sự cố hoặc ưu đãi có hạn trong ngày
  - Gửi link giả website ngân hàng hoặc yêu cầu đọc OTP
  - Yêu cầu chuyển tiền sang tài khoản khác để xác minh hoặc "bảo vệ số dư"
truong:
  nguoi_lien_lac: {nguoi_la: 0.98}
