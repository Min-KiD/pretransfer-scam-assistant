dau_hieu:
  - Nhân viên ngân hàng hỏi mã OTP hoặc mật khẩu
  - Link không phải tên miền chính thức của ngân hàng
  - Chuyển tiền để "xác minh" vào tài khoản cá nhân
viec_can_kiem_tra:
  - Cúp máy, gọi số tổng đài in trên thẻ hoặc trong app chính thức
  - Không đọc OTP cho bất kỳ ai
cau_noi_mau:
  - "Em bên trung tâm thẻ, thẻ của chị được nâng hạn mức lên 80 triệu, chị đọc giúp em mã vừa gửi về máy."
  - "Tài khoản anh phát sinh giao dịch 12.500.000đ ở nước ngoài, anh vào link này hủy ngay kẻo bị trừ."
