dau_hieu:
  - Tên chủ tài khoản nhận không phải tên người quen
  - Chỉ nhắn tin, từ chối gọi điện thường
  - Mượn gấp, hứa trả ngay
viec_can_kiem_tra:
  - Gọi điện thường theo số đã lưu trong danh bạ, không gọi qua chính ứng dụng đó
  - Hỏi một câu chỉ hai người biết
cau_noi_mau:
  - "Em ơi anh đang họp không nghe máy được, em ck giúp anh 20tr vào stk bạn anh, chiều anh gửi lại."
  - "Stk: 0481000xxxxxx NGUYEN VAN TUAN nhé, gấp lắm em."
