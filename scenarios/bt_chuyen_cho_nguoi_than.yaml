id: bt_chuyen_cho_nguoi_than
ten: Chuyển tiền cho người thân, bạn bè đã nói chuyện trực tiếp hoặc qua điện thoại
nhom: binh_thuong
nguon:
  - {noi: "Tự viết", url: "", do_tin_cay: tu_viet}
mo_ta: >
  Người dùng gửi tiền cho bố mẹ, anh chị em, bạn bè: tiền sinh hoạt, góp tiền ăn, trả nợ đã mượn.
  Hai bên đã gặp nhau hoặc gọi điện thường. Tài khoản đứng đúng tên người đó.
  Đây là trường hợp dễ nhầm với "mạo danh người quen", khác ở tên tài khoản và việc đã nghe giọng, gặp mặt.
cac_buoc:
  - Hai bên trao đổi trực tiếp hoặc qua cuộc gọi thường
  - Người thân gửi số tài khoản đứng tên chính họ
truong:
  nguoi_lien_lac: {nguoi_quen: 0.99}
  kenh: {truc_tiep: 0.4, cuoc_goi: 0.3, zalo: 0.2, messenger: 0.1}
