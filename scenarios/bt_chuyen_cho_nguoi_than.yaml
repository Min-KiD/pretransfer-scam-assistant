  da_chuyen_truoc_do: {khong: 0.5, co: 0.5}
dau_hieu:
  - Tên chủ tài khoản đúng là người thân
  - Đã nghe giọng hoặc gặp mặt
viec_can_kiem_tra:
  - Nếu chỉ mới nhắn tin thì gọi điện thường một lần
cau_noi_mau:
  - "Mẹ gửi con số tài khoản của mẹ nhé, tháng này con gửi 3 triệu."
