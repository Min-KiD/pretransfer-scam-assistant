dau_hieu:
  - Đi làm mà phải nộp tiền trước
  - Đã được trả vài khoản nhỏ, giờ bị đòi nạp khoản lớn hơn
  - Tài khoản nhận tiền đổi liên tục, là tài khoản cá nhân
viec_can_kiem_tra:
  - Dừng nạp thêm; tiền đã nạp không lấy lại được bằng cách nạp tiếp
  - Tìm tên công ty tuyển dụng trên website chính thức của sàn họ mạo danh
cau_noi_mau:
  - "Đơn 3 trong chuỗi là 5.800.000đ, bạn ck xong hệ thống hoàn gốc + 30% hoa hồng trong 5 phút."
  - "Bạn nhập sai nội dung nên lệnh rút bị treo, cần nạp bù 12tr để mở khóa nhé."
