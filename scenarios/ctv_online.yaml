id: ctv_online
ten: Tuyển cộng tác viên online, nạp tiền làm nhiệm vụ nhận hoa hồng
nhom: lua_dao
nguon:
  - {noi: "Công an tỉnh Đắk Lắk: bẫy nạp tiền làm nhiệm vụ nhận hoa hồng", url: "https://congan.daklak.gov.vn/hoat-dong-cua-dia-phuong/cong-an-xa-cu-m-ta-canh-bao-bay-nap-tien-lam-nhiem-vu-de-nhan-hoa-hong-tren-mang-14601.html", do_tin_cay: tim_kiem}
  - {noi: "Công an tỉnh Vĩnh Long: lừa đảo tuyển cộng tác viên online", url: "https://congan.vinhlong.gov.vn/canh-bao-phuong-thuc-thu-doan-cua-toi-pham/canh-giac-voi-thu-doan-lua-dao-tuyen-cong-tac-vien-online-7497.html", do_tin_cay: tim_kiem}
mo_ta: >
  Quảng cáo "việc nhẹ lương cao, làm tại nhà". Nạn nhân được kéo vào nhóm Telegram hoặc Zalo, làm vài nhiệm vụ nhỏ
  (thả tim, đặt đơn ảo, xem phim ngắn) và được trả tiền thật. Các nhiệm vụ sau đòi nạp số tiền lớn dần;
  khi muốn rút thì bị báo sai cú pháp, phải nạp thêm để mở khóa.
cac_buoc:
  - Nạn nhân thấy quảng cáo hoặc được nhắn mời làm cộng tác viên
  - Nhiệm vụ đầu nhỏ, được trả tiền thật để tạo lòng tin
  - Nhiệm vụ sau phải ứng tiền trước, số tiền tăng dần
  - Không rút được, bị đòi nạp thêm để "hoàn thành chuỗi" hoặc "sửa lỗi"
